name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install tox
      - name: Run tests with coverage
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.1.0"
        run: |
          tox -e cov
          mv .coverage .coverage.${{ matrix.python-version }}
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: .coverage.${{ matrix.python-version }}
          include-hidden-files: true
          if-no-files-found: error

  # The oldest versions pyproject.toml admits must work too: pin every declared
  # ">=" floor (runtime and extras, not dev tooling) and run the suite on the
  # oldest supported Python.
  floors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install tox
      - name: Pin every declared dependency floor
        run: |
          python - > "$RUNNER_TEMP/floors.txt" <<'EOF'
          import re, tomllib
          p = tomllib.load(open("pyproject.toml", "rb"))["project"]
          reqs = p.get("dependencies", []) + [
              r for extra, rs in p.get("optional-dependencies", {}).items()
              if extra not in ("dev", "test", "tests", "docs") for r in rs
          ]
          pins = {}
          for r in reqs:
              m = re.match(r"\s*([A-Za-z0-9_.-]+)(?:\[[^\]]*\])?\s*>=\s*([0-9][^,;\s]*)", r)
              if m and m.group(1).lower() != p["name"].lower():
                  pins[m.group(1).lower()] = m.group(2)
          print("".join(f"{k}=={v}\n" for k, v in sorted(pins.items())), end="")
          EOF
          cat "$RUNNER_TEMP/floors.txt"
      - name: Run the suite at the floors
        env:
          PIP_CONSTRAINT: ${{ runner.temp }}/floors.txt
          SETUPTOOLS_SCM_PRETEND_VERSION: "0.1.0"
        run: tox -e py311

  coverage:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          path: coverage-reports
      - name: Combine and upload
        run: |
          pip install coverage
          files=$(find coverage-reports -type f -name ".coverage.*")
          if [ -z "$files" ]; then echo "No coverage files"; exit 1; fi
          coverage combine $files
          coverage xml
      - uses: codecov/codecov-action@v7
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

  sonar:
    if: github.event_name == 'push'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=dperezcabrera
            -Dsonar.projectKey=dperezcabrera_${{ github.event.repository.name }}
            -Dsonar.projectName=${{ github.event.repository.name }}
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.11,3.12,3.13,3.14
